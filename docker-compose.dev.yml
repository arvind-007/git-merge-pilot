# Local development / test database only. Start with:
#   docker compose -f docker-compose.dev.yml up -d
# Own project name so it never collides with the main docker-compose.yml stack.
name: git-merge-pilot-dev
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gmp
      POSTGRES_PASSWORD: gmp
      POSTGRES_DB: gmp
    ports:
      - '54329:5432'
    volumes:
      - gmp-dev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gmp -d gmp']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  gmp-dev-pgdata:

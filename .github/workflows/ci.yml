name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gmp
          POSTGRES_PASSWORD: gmp
          POSTGRES_DB: gmp
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U gmp -d gmp"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://gmp:gmp@localhost:54329/gmp
      TEST_DATABASE_URL: postgres://gmp:gmp@localhost:54329/gmp
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version is read from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate (smoke)
        run: pnpm db:migrate

      - name: Test
        run: pnpm test

      - name: Build web
        run: pnpm --filter @gmp/web run build

      - name: Bundle server, worker and migrate CLI
        run: |
          pnpm --filter @gmp/server run build
          pnpm --filter @gmp/worker run build
          pnpm --filter @gmp/db run build

  docker:
    name: Docker image (build only)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Dockerfile lint
        run: docker build --check .

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: git-merge-pilot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test entrypoint and tools
        run: |
          docker run --rm git-merge-pilot:ci help
          docker run --rm git-merge-pilot:ci gitleaks version
          docker run --rm git-merge-pilot:ci semgrep --version
          docker run --rm git-merge-pilot:ci git --version
